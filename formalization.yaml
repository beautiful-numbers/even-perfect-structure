fidelity:
  divergences: >-
    This first Palomar submission intentionally omits the distribution,
    enumeration, and algorithmic-scan portions of the accompanying paper.

    The theorem calibration_bound is proved by the stronger elementary route
    greatestProperDivisor N ≤ N/2 ≤ L(2L-1)/2. Consequently, the coprimality
    and non-primality hypotheses are retained in the advertised statement for
    fidelity to the paper's structural setting, although they are not needed
    by the formal proof.

    The theorem profile_calibration_identity is formally stronger than the
    prime-certified formulation suggested by the paper: it holds for every
    canonical candidate with a ≥ 1, without any primality or divisor-pattern
    hypothesis.

    The theorem calibration_transition is stated for arbitrary dyadic levels
    a < b. It formalizes only the exact algebraic transition identity and does
    not formalize the structural-successor, minimality, or no-intermediate-level
    claims from the paper.

    The reverse implication EvenPerfect → InternalStructure is proved in the
    downstream Audit module using Mathlib's existing formalization of the
    classical characterization of even perfect numbers. No upstream structural
    theorem depends on this audit.

review:
  status: "self-assessed"

  reviewers:
    - "Daniel Sautot"

  notes: >-
    The advertised Challenge surface was checked against the proof library
    and Comparator configuration. Challenge.lean contains exactly the
    deliberate statement-level sorry declarations; the proof development and
    Solution.lean contain no deliberate proof holes. The principal public
    results were checked with #print axioms and depend only on propext,
    Quot.sound, and Classical.choice. Comparator successfully built and
    exported Challenge and Solution, NanoDa accepted the solution, the Lean
    default kernel accepted the solution, and Comparator reported
    "Your solution is okay!" in the local development run. That Windows run
    used fake-landrun rather than the trusted Linux Landrun sandbox.

alignment:
  namespace: "EvenPerfectStructure"

  statements:
    - source: "Median identity recovers the canonical profile"
      lean: "EvenPerfectStructure.median_identity_recovers_profile"
      module: "EvenPerfectStructure.SR.Median"
      status: "proved"
      note: >-
        From a ≥ 1, L = 2^a, M = kL, and the median identity, proves
        k = 2L - 1 and M = L(2L - 1).

    - source: "Internal divisor pattern characterizes primality"
      lean: "EvenPerfectStructure.divisor_structure"
      module: "EvenPerfectStructure.DivisorPattern"
      status: "proved"
      note: >-
        For the canonical candidate, the divisors below the dyadic pillar are
        exactly the lower powers of two if and only if the recovered odd
        factor is prime.

    - source: "Composite odd-factor obstruction"
      lean: "EvenPerfectStructure.composite_odd_factor_breaks_pattern"
      module: "EvenPerfectStructure.Certification"
      status: "proved"
      note: >-
        Produces an explicit nontrivial odd divisor below the pillar when the
        canonical odd factor is not prime and proves failure of the lower
        dyadic pattern.

    - source: "Internal structure certifies even perfection"
      lean: "EvenPerfectStructure.internal_structure_implies_evenPerfect"
      module: "EvenPerfectStructure.Certification"
      status: "proved"
      note: >-
        Core structural direction. It is proved before the Audit module and
        certifies perfection directly through divisor-sum identities rather
        than by invoking the classical classification.

    - source: "Global structural characterization"
      lean: "EvenPerfectStructure.evenPerfect_iff_internalStructure"
      module: "EvenPerfectStructure.Audit"
      status: "proved"
      note: >-
        Combines the internally proved structural direction with a downstream
        compatibility proof of EvenPerfect → InternalStructure based on
        Mathlib's formal classical characterization.

    - source: "Canonical-family structural characterization"
      lean: "EvenPerfectStructure.divisor_pattern_iff_evenPerfect"
      module: "EvenPerfectStructure.Audit"
      status: "proved"
      note: >-
        Shows that the lower dyadic divisor pattern of a canonical candidate
        is equivalent to even perfection. The reverse direction uses the
        final audit and uniqueness of the power-of-two exponent.

    - source: "Universal calibration bound"
      lean: "EvenPerfectStructure.calibration_bound"
      module: "EvenPerfectStructure.Calibration"
      status: "proved"
      note: >-
        Bounds the greatest proper divisor by theta(L) * gauge(L). The formal
        proof uses a stronger elementary bound and does not require all
        hypotheses carried by the advertised statement.

    - source: "Exact canonical-profile calibration"
      lean: "EvenPerfectStructure.profile_calibration_identity"
      module: "EvenPerfectStructure.Calibration"
      status: "proved"
      note: >-
        Establishes the exact greatest-proper-divisor calibration identity for
        every canonical candidate with a ≥ 1, without a primality hypothesis.

    - source: "Calibration scale tends to eight"
      lean: "EvenPerfectStructure.calibration_tends_to_eight"
      module: "EvenPerfectStructure.Calibration"
      status: "proved"
      note: >-
        Proves both strict monotonicity of theta on natural arguments and
        convergence to 8 at infinity.

    - source: "Exact calibration transition"
      lean: "EvenPerfectStructure.calibration_transition"
      module: "EvenPerfectStructure.Sequential"
      status: "proved"
      note: >-
        Exact identity for arbitrary a < b. It is not a successor theorem and
        asserts no minimality or no-intruder property.

acknowledgements: >-
  Lean 4 and Mathlib provide the proof assistant and mathematical library.
  The final compatibility audit uses
  Archive.Wiedijk100Theorems.PerfectNumbers. Comparator, lean4export and
  NanoDa were used to validate the submitted Challenge/Solution interface.