version: "v0.4"

project:
  name: "Structural Calibration and Sigma Distribution of Even Perfect Numbers"

  description: >-
    A Lean 4 formalization of the structural and calibration core of
    "Structural Calibration and Sigma Distribution of Even Perfect Numbers".
    The development introduces an internal dyadic divisor certificate for
    even perfect numbers, proves that its median identity recovers the
    canonical factorization M = L(2L - 1), characterizes the canonical
    lower-divisor pattern by primality of the odd factor, gives an explicit
    obstruction when that odd factor is composite, and certifies even
    perfection directly from the recovered structure using divisor sums.
    A final downstream audit establishes the reverse implication from
    Mathlib's formal classification of even perfect numbers, yielding the
    equivalence EvenPerfect M ↔ InternalStructure M. The formalization also
    proves a universal greatest-proper-divisor calibration bound, an exact
    calibration identity for the canonical profile, convergence of the
    calibration scale to 8, and an exact transition identity between
    arbitrary dyadic levels.

  authors:
    - "Daniel Sautot"

  license: "Apache-2.0"

  responsible_maintainers:
    - "Daniel Sautot"

classification:
  arxiv:
    - "math.NT"

  msc2020:
    - "11A25"
    - "11A41"

sources:
  - title: "Structural Calibration and Sigma Distribution of Even Perfect Numbers"
    authors:
      - "Daniel Sautot"
    type: "paper"
    relationship: "formalizes"
    location: "https://zenodo.org/records/17548227"
    note: >-
      This formalization covers the structural and calibration core of the
      manuscript. Distribution, enumeration, and algorithmic scanning are
      intentionally outside the scope of this first formalization.
    license: "CC-BY-4.0"
    author_endorsement: "participated"

related_formalizations:
  - id: "Archive.Wiedijk100Theorems.PerfectNumbers"
    relationship: "builds-on"
    note: >-
      Mathlib's existing formalization of the classical characterization of
      even perfect numbers is used only in the final Audit module for the
      reverse compatibility implication EvenPerfect → InternalStructure and
      the reverse direction of the canonical-family equivalence. It is not
      used to derive the structural theory.

status:
  scope: >-
    The submission formalizes the structural and calibration core only.
    It includes the dyadic pillar and odd-factor profile, the exact lower
    divisor pattern, recovery of k = 2L - 1 from the median identity,
    equivalence of the canonical divisor pattern with primality of the odd
    factor, an explicit composite-factor obstruction, direct certification
    InternalStructure → EvenPerfect, the audited global equivalence
    EvenPerfect ↔ InternalStructure, the canonical-family equivalence between
    divisor pattern and even perfection, the universal calibration bound,
    the exact canonical-profile calibration identity, monotonicity and
    convergence of theta to 8, and the exact calibration transition law.
    Distribution functions, sigma-distribution results, enumeration and
    algorithmic scanning are not included in this submission. The reverse
    implication EvenPerfect → InternalStructure is intentionally isolated in
    EvenPerfectStructure.Audit and uses Mathlib's classical classification;
    no upstream structural theorem depends on that audit.

  sorry_count: 0

  sorry_in_definitions: 0

  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"

  main_results:
