    - declaration: "EvenPerfectStructure.divisor_pattern_iff_evenPerfect"
      file: "EvenPerfectStructure/Audit.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "comparator.json"

    - declaration: "EvenPerfectStructure.internal_structure_implies_evenPerfect"
